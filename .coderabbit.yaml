# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit

language: fr-FR

tone_instructions: 'Sois pédagogue et précis. Le projet est un exercice scolaire en architecture clean (ESGI). Explique pourquoi les changements sont recommandés.'

early_access: false
enable_free_tier: true

reviews:
  profile: assertive

  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: '@coderabbitai summary'
  high_level_summary_in_walkthrough: true
  auto_title_placeholder: '@coderabbitai'
  review_status: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  poem: false

  path_filters:
    - '!dist/**'
    - '!node_modules/**'
    - '!**/*.js.map'

  path_instructions:
    - path: 'src/domain/**'
      instructions: |
        Cette couche est le coeur de l'architecture clean. Vérifie que :
        - Les entités n'ont aucune dépendance vers les couches externes (application, infrastructure).
        - La logique métier est bien encapsulée dans les entités (pas dans les use cases).
        - Les value objects sont immutables.
        - Pas d'imports de frameworks (express, bcrypt, etc.) dans cette couche.

    - path: 'src/application/**'
      instructions: |
        Couche application (use cases et ports). Vérifie que :
        - Les use cases ne dépendent que des interfaces (ports/repositories), jamais des implémentations concrètes.
        - Chaque use case a une responsabilité unique (SRP).
        - Les ports/interfaces sont bien définis et séparent correctement le domaine de l'infrastructure.

    - path: 'src/infrastructure/**'
      instructions: |
        Couche infrastructure (frameworks, adapters, implémentations). Vérifie que :
        - Les dépendances vont uniquement vers l'intérieur (application/domain), jamais l'inverse.
        - Les adaptateurs (repositories, services) implémentent correctement les interfaces définies dans l'application.
        - La configuration (env, JWT, etc.) est bien isolée dans des adapters dédiés.

  abort_on_close: true
  disable_cache: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - 'WIP'
      - 'DO NOT MERGE'
      - 'DRAFT'
    labels: []
    drafts: false
    # Reviews sur main ET develop
    base_branches:
      - 'main'
      - 'develop'

  finishing_touches:
    docstrings:
      enabled: true

  tools:
    ast-grep:
      essential_rules: true
      rule_dirs: []
      util_dirs: []
      packages: []

    # Désactivé : pas de fichier eslint.config.* à la racine du projet
    eslint:
      enabled: false

    # Désactivé : pas de biome.json à la racine du projet
    biome:
      enabled: false

    # Pertinent : fonctionne sans config, analyse directement les fichiers TS/JS
    oxc:
      enabled: true

    # Pertinent : détection de secrets dans le code
    gitleaks:
      enabled: true

    # Pertinent : linter YAML (pour les fichiers de config)
    yamllint:
      enabled: true

    # Pertinent : linter Markdown (README, docs)
    markdownlint:
      enabled: true

    # Désactivé : pas de .github/workflows/ dans le projet
    actionlint:
      enabled: false

    # Désactivé : pas de Dockerfile à la racine du projet
    hadolint:
      enabled: false

    # Pertinent : GitHub Checks
    github-checks:
      enabled: true
      timeout_ms: 90000

    # Non pertinent : projet TypeScript, pas Python
    ruff:
      enabled: false

    # Non pertinent : pas de scripts shell
    shellcheck:
      enabled: false

    # Non pertinent : pas de Go
    golangci-lint:
      enabled: false

    # Non pertinent : pas de PHP
    phpstan:
      enabled: false

    # Non pertinent : pas de Ruby
    rubocop:
      enabled: false

    # Non pertinent : pas de Swift
    swiftlint:
      enabled: false

    # Non pertinent : pas de Java
    pmd:
      enabled: false

    # Non pertinent : pas de Kotlin
    detekt:
      enabled: false

    # Non pertinent : pas de C/C++
    cppcheck:
      enabled: false

    # Non pertinent : pas de Protobuf
    buf:
      enabled: false

    # Non pertinent : pas de Rego
    regal:
      enabled: false

    # Non pertinent : pas de CircleCI
    circleci:
      enabled: false

    # Non pertinent : pas de SQL explicite
    sqlfluff:
      enabled: false

    # Non pertinent : pas de Prisma
    prismaLint:
      enabled: false

    # Non pertinent : pas de Shopify
    shopifyThemeCheck:
      enabled: false

    # Non pertinent : pas d'IaC
    checkov:
      enabled: false

    # Semgrep : utile pour détecter des patterns de sécurité dans le code TS
    semgrep:
      enabled: true

    # LanguageTool : désactivé pour éviter le bruit sur le code
    languagetool:
      enabled: false

chat:
  allow_non_org_members: false
  auto_reply: true
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local

code_generation:
  docstrings:
    language: fr-FR
    path_instructions: []
